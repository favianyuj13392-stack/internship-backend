server:
  port: 8085
minio:
  endpoint: http://localhost:9000
  accessKey: internship
  secretKey: internship2024
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/internship
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  logging:
    level:
      org:
        hibernate:
          SQL: DEBUG
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8081/realms/InternshipUCB
          jwk-set-uri: http://localhost:8081/realms/InternshipUCB/protocol/openid-connect/certs
keycloak:
  url: http://localhost:8081/
token:
  converter:
    principal-attribute: preferred_username
    resource-id: internship_cliente

#Configuraciones de seguridad
security-constraints:
  constraints:
    - auth-roles:
        - ESTUDIANTE
      security-collections:
        - name: student
          patterns:
            - /test/student
          methods:
            - GET

    - auth-roles:
        - EMPRESA
      security-collections:
        - name: business
          patterns:
            - /test/business
          methods:
            - GET

    - auth-roles:
        - ADMIN
      security-collections:
        - name: admin
          patterns:
            - /test/admin
          methods:
            - GET

debug: true

