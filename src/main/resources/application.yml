server:
  port: 8085
minio:
  endpoint: http://localhost:9000
  accessKey: internship
  secretKey: internship2024
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/internship
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
  jpa:
